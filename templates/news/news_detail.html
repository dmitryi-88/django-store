<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ news.title }}</title>
</head>

<body>
    <div class="newsDetail">
        <article>
            <h1>{{ news.title }}</h1>

            <p>Категория: {{ news.category.name }}</p>
            <p>Автор: {{ news.author.email }}</p>
            <p>Опубликовано: {{ news.created_at }}</p>

            <h2>Детали:</h2>
            <span>{{ news.content|linebreaks }}</span>
        </article>

        <a href="{% url 'news:news_list' %}">К списку новостей</a>
    </div>
</body>

</html>
