
{% extends "base.html" %}

{% block title %}Удаление новости — Django Store{% endblock %}

{% block content %}
<div class="narrow">
    <section class="panel confirm-panel">
        <h1>Удаление новости</h1>

        <p>
            Ты действительно хочешь удалить новость
            <strong>«{{ object.title }}»</strong>?
        </p>

        <p class="muted">
            После подтверждения новость будет удалена.
        </p>

        <div class="actions">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    Да, удалить
                </button>
            </form>

            <a
                href="{% url 'news:news_detail' object.pk %}"
                class="btn btn-secondary"
            >
                Отмена
            </a>
        </div>
    </section>
</div>
{% endblock %}
