{% extends "base.html" %}

{% block title %}Регистрация — Django Store{% endblock %}

{% block content %}
<div class="narrow">
    <section class="panel form-panel auth-panel">
        <div class="auth-heading">
            <span class="pill">Присоединяйся</span>
            <h1>Создание аккаунта</h1>
            <p class="muted">
                Зарегистрируйся, чтобы покупать товары и публиковать объявления.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn">
                Зарегистрироваться
            </button>
        </form>

        <div class="auth-footer">
            <p class="muted">Уже есть аккаунт?</p>
            <a href="{% url 'login' %}">Войти</a>
        </div>
    </section>
</div>
{% endblock %}
