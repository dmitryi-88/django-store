{% extends "base.html" %}

{% block title %}Удаление объявления — Django Store{% endblock %}

{% block content %}
<div class="narrow">
    <section class="panel confirm-panel">
        <div class="empty-state">
            <h1>Удаление объявления</h1>

            <p>
                Ты действительно хочешь удалить объявление
                <strong>«{{ listing.title }}»</strong>?
            </p>

            <p class="muted">
                Это действие нельзя будет отменить.
            </p>
        </div>

        <div class="actions">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    Да, удалить
                </button>
            </form>

            <a href="{% url 'listing_list' %}" class="btn btn-secondary">
                Отмена
            </a>
        </div>
    </section>
</div>
{% endblock %}
